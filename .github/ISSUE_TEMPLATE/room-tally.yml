name: Room tally
description: Numbers from one room you hosted. Numbers only, never names.
title: "Room tally"
labels: ["room-tally"]
body:
  - type: markdown
    attributes:
      value: "Your AI, as files you own. Learn it in an hour (being tested). Run it on any computer (being tested). Hand it to anyone. This is everything we count. Please write numbers only, never anyone's name. This page is public."
  - type: input
    id: date
    attributes: {label: Date, placeholder: "2026-12-05"}
    validations: {required: true}
  - type: input
    id: arrived
    attributes: {label: "1. How many arrived"}
    validations: {required: true}
  - type: input
    id: first_time
    attributes: {label: "2. How many were taking the hour for the first time"}
    validations: {required: true}
  - type: input
    id: never_coded_arrived
    attributes: {label: "2b. Of those who arrived, how many had never written code"}
    validations: {required: true}
  - type: input
    id: copilot
    attributes: {label: "3. How many had Copilot ready when they arrived"}
    validations: {required: true}
  - type: input
    id: finished
    attributes: {label: "4. How many finished all six steps within 60 minutes, closed it, opened it again and got their fact back"}
    validations: {required: true}
  - type: input
    id: finished_first
    attributes: {label: "5. Of those who finished, how many were first-timers"}
    validations: {required: true}
  - type: input
    id: never_coded
    attributes: {label: "6. Of those who finished, how many had never written code"}
    validations: {required: true}
  - type: input
    id: want_host
    attributes: {label: "7. How many said they want to host a room (give them this page and the room guide to take home)"}
    validations: {required: true}
  - type: dropdown
    id: first_room
    attributes:
      label: "8. Is this the first room you have hosted?"
      options: ["Yes", "No"]
    validations: {required: true}
  - type: dropdown
    id: brought
    attributes:
      label: "9. What brought you here?"
      options: ["Someone who made the hour asked me", "Another host", "I took the hour in a room", "A friend who took the hour", "I found it myself"]
    validations: {required: true}
  - type: input
    id: hardest
    attributes: {label: "The hardest step (one or two words)"}
